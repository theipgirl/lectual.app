<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectual · Other pages</title>
<!--
  Companion to Matters_Prototype.dc.html. Same tokens, type and components:
  paper #F6F0E3 · card #FFFDF7 · ink #2A1216 · body #4A2A2E · muted #7A5A5E
  oxblood #6A1F2B (primary) · wine #8E2733 (links, risk) · ok #43602F · warn #7C5312
  Instrument Serif (titles) · Geist (UI) · Courier Prime (labels, numbers)
  Pages: Documents · Client portals · Campaigns · Settings (Mailboxes, Agents, Team, Firm).
  Plain HTML + vanilla JS so it opens anywhere; the rail here stands in for the dc Rail component.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F0E3;--card:#FFFDF7;--well:#F1E8D8;--ink:#2A1216;--body:#4A2A2E;--muted:#7A5A5E;
  --ox:#6A1F2B;--ox-deep:#230810;--wine:#8E2733;--ok:#43602F;--warn:#7C5312;--cream:#FDF7EB;
  --line:rgba(42,18,22,.13);--line2:rgba(42,18,22,.08);
  --shadow:0 1px 2px rgba(20,4,8,.05),0 12px 28px -22px rgba(20,4,8,.4);
  --serif:'Instrument Serif',serif;--mono:'Courier Prime','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:var(--wine);text-decoration:none}a:hover{color:var(--ox);text-decoration:underline}
[role=button],[role=switch],[role=tab]{cursor:pointer}
[role=button]:focus-visible,[role=switch]:focus-visible,[role=tab]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ox);outline-offset:2px;border-radius:8px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drawer{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toast{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* shell */
.app{height:100vh;min-height:600px;display:flex;flex-direction:column;overflow:hidden}
.top{flex:0 0 auto;display:flex;align-items:center;gap:18px;height:76px;padding:0 26px;background:var(--card);border-bottom:1px solid var(--line)}
.mark{font-family:var(--serif);font-size:27px;letter-spacing:.01em;color:var(--ox);white-space:nowrap}
.mark sup{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-left:4px}
.vr{width:1px;height:26px;background:var(--line)}
.sect{font-family:var(--mono);font-size:13.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ox);white-space:nowrap}
.search{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);flex:0 1 240px;min-width:120px}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:15px;color:var(--ink)}
.me{width:34px;height:34px;border-radius:999px;background:var(--ox);color:var(--cream);font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.main{flex:1;min-height:0;display:flex}
.rail{flex:0 0 auto;width:94px;position:relative}
.rail nav{position:absolute;left:16px;top:16px;bottom:16px;width:62px;border-radius:16px;background:var(--ox-deep);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;box-shadow:var(--shadow);overflow-y:auto}
.rail .ri{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#C7ADB2;position:relative;flex:0 0 auto}
.rail .ri:hover{background:rgba(253,247,235,.08);color:var(--cream)}
.rail .ri.on{background:var(--cream);color:var(--ox)}
.rail .ri .tip{position:absolute;left:56px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--cream);font-size:13px;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60}
.rail .ri:hover .tip,.rail .ri:focus-visible .tip{opacity:1}
.rail .sep{width:30px;height:1px;background:rgba(253,247,235,.14);margin:6px 0}
.rail svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;min-width:0;display:flex;padding:18px 26px 18px 0;overflow:hidden}
.page{flex:1;min-width:0;display:flex;gap:20px;animation:fade .18s}

/* shared bits */
.lbl{font-family:var(--mono);font-size:12.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--serif);font-size:38px;line-height:1.05;margin:4px 0 0;font-weight:400}
.h2{font-family:var(--serif);font-size:27px;line-height:1.1;margin:0;font-weight:400}
.sub{font-size:15.5px;color:var(--body);line-height:1.55;max-width:640px;text-wrap:pretty;margin:8px 0 0}
.card{border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.side{width:210px;flex:0 0 auto;display:flex;flex-direction:column;gap:24px;overflow-y:auto;padding-right:2px}
.side .grp{display:flex;flex-direction:column;gap:6px}
.fi{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;font-size:14.5px;color:var(--body);white-space:nowrap}
.fi:hover{background:var(--well)}
.fi.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(20,4,8,.08)}
.fi .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;overflow-y:auto;padding-right:4px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head .grow{flex:1;min-width:260px}
.btn{height:38px;padding:0 16px;border-radius:9px;display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;white-space:nowrap;border:1px solid transparent;user-select:none}
.btn.pri{background:var(--ox);color:var(--cream)}.btn.pri:hover{background:#5A1924}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}.btn.sec:hover{background:var(--well)}
.btn.ghost{color:var(--body)}.btn.ghost:hover{background:var(--well)}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px}
.btn.danger{color:var(--wine);border-color:rgba(142,39,51,.3);background:var(--card)}
.segs{display:flex;padding:3px;border-radius:10px;background:var(--well);gap:2px}
.segs div{height:30px;padding:0 13px;border-radius:8px;display:flex;align-items:center;font-size:14px;color:var(--body);white-space:nowrap}
.segs div.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(20,4,8,.08)}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap;display:inline-block}
.p-ok{background:rgba(67,96,47,.12);color:var(--ok)}.p-warn{background:rgba(124,83,18,.14);color:var(--warn)}
.p-risk{background:rgba(142,39,51,.11);color:var(--wine)}.p-mute{background:var(--well);color:var(--muted)}.p-ox{background:var(--ox);color:var(--cream)}
.dot{width:9px;height:9px;border-radius:999px;flex:0 0 auto;display:inline-block}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{font-family:var(--mono);font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.tbl td{padding:0 14px;height:52px;border-bottom:1px solid var(--line2);font-size:14.5px;color:var(--body);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FBF6EC}
.tbl td.pri{color:var(--ink);font-weight:500}
.tbl .clip{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.toggle{width:40px;height:23px;border-radius:999px;padding:2px;display:flex;align-items:center;flex:0 0 auto;background:var(--well);border:1px solid rgba(42,18,22,.15);justify-content:flex-start;transition:background .15s}
.toggle i{width:19px;height:19px;border-radius:999px;background:var(--muted)}
.toggle.on{background:var(--ox);border-color:var(--ox);justify-content:flex-end}.toggle.on i{background:var(--cream)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{padding:16px 18px}.kpi .v{font-family:var(--mono);font-size:27px;margin-top:8px;font-variant-numeric:tabular-nums}.kpi .s{font-size:13.5px;color:var(--muted);margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea,.field select{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none}
.field textarea{min-height:88px;resize:vertical;line-height:1.5}
.rule{border-top:1px solid var(--line)}
.note{font-size:13.5px;color:var(--muted);line-height:1.5;text-wrap:pretty}
.upl{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:rgba(106,31,43,.06);border:1px solid rgba(106,31,43,.16);font-size:13.5px;color:var(--body);line-height:1.5}
.upl b{color:var(--ox);font-weight:600}
.av{width:30px;height:30px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--cream);flex:0 0 auto}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* drawer + modal + toast */
.scrim{position:fixed;inset:0;background:rgba(35,8,16,.28);z-index:80;animation:fade .15s}
.drawer{position:fixed;top:14px;right:14px;bottom:14px;width:min(520px,calc(100vw - 28px));background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -20px rgba(20,4,8,.5);z-index:90;display:flex;flex-direction:column;animation:drawer .22s cubic-bezier(.4,0,.2,1)}
.drawer .dh{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer .db{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-left:auto;flex:0 0 auto}.x:hover{background:var(--well)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 32px));background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(20,4,8,.55);z-index:95;animation:fade .15s;overflow:hidden}
.toastw{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99}
.toastw div{background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:10px;font-size:14.5px;animation:toast .2s;box-shadow:0 12px 30px -12px rgba(20,4,8,.6)}
.spin{width:18px;height:18px;border-radius:999px;border:2px solid rgba(106,31,43,.2);border-top-color:var(--ox);animation:spin .8s linear infinite;flex:0 0 auto}

/* documents */
.doc-kind{width:34px;height:40px;border-radius:5px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ox);flex:0 0 auto;position:relative}
.doc-kind:before{content:"";position:absolute;top:-1px;right:-1px;width:10px;height:10px;background:var(--well);border-left:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 5px 0 4px}
.paperpv{background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px 28px;font-size:13.5px;line-height:1.6;color:#2b2123;box-shadow:inset 0 0 0 6px #fbf8f2}
.paperpv h4{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 10px}

/* portals */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{padding:18px;display:flex;flex-direction:column;gap:12px}
.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.browser .bar{height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--well);border-bottom:1px solid var(--line)}
.browser .bar i{width:8px;height:8px;border-radius:99px;background:rgba(42,18,22,.18)}
.browser .bar span{margin-left:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.steps{display:flex;gap:0;align-items:flex-start}
.steps .st{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11px;line-height:1.2;padding:0 3px;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.steps .st:before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:var(--line)}
.steps .st:first-child:before{display:none}
.steps .st.done:before,.steps .st.now:before{background:var(--ok)}
.steps .st b{width:18px;height:18px;border-radius:99px;background:var(--card);border:2px solid var(--line);position:relative;z-index:1}
.steps .st.done b{background:var(--ok);border-color:var(--ok)}
.steps .st.now b{background:var(--card);border-color:var(--ox);box-shadow:0 0 0 4px rgba(106,31,43,.12)}
.steps .st.now{color:var(--ox);font-weight:600}

/* campaigns */
.seq{display:flex;flex-direction:column;gap:0}
.seq .step{display:flex;gap:14px;position:relative;padding-bottom:18px}
.seq .step:after{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.seq .step:last-child:after{display:none}
.seq .ix{width:32px;height:32px;border-radius:99px;background:var(--well);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--ox);flex:0 0 auto}
.bar-h{height:8px;border-radius:99px;background:var(--well);overflow:hidden}.bar-h i{display:block;height:100%;background:var(--ox);border-radius:99px}

/* settings */
.stabs{display:flex;flex-direction:column;gap:2px}
.mbx{display:flex;align-items:center;gap:14px;padding:16px 18px}
.mbx + .mbx{border-top:1px solid var(--line2)}
.prov{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lv{display:flex;padding:3px;border-radius:9px;background:var(--well);gap:2px}
.lv div{flex:1;text-align:center;padding:6px 0;border-radius:7px;font-size:13.5px;color:var(--muted)}
.lv div.on{background:var(--card);color:var(--ox);font-weight:600;box-shadow:0 1px 2px rgba(20,4,8,.12)}
.runs td{height:44px}

@media (max-width:900px){
  .side{display:none}
  .top{padding:0 16px;gap:12px}.top .sect{display:none}
  .rail{width:0}.rail nav{position:fixed;left:auto;right:auto;top:auto;bottom:10px;left:50%;transform:translateX(-50%);width:auto;height:58px;flex-direction:row;padding:0 8px;z-index:70}
  .rail .sep{width:1px;height:26px;margin:0 4px}.rail .tip{display:none}
  .content{padding:16px 16px 84px}
  .h1{font-size:31px}
  .mbx{flex-wrap:wrap}.mbx>div:nth-child(2){flex:1 1 calc(100% - 54px)!important}.hide-sm{display:none}
  .rail nav{max-width:calc(100vw - 20px);overflow-x:auto}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="mark" id="firmMark">RPB Law<sup>OS</sup></div>
    <div class="vr"></div>
    <div class="sect" id="sect">Documents</div>
    <div style="flex:1"></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7A5A5E" stroke-width="1.7" stroke-linecap="round"><path d="M10.5 17a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13zM15.5 15.5L20 20"/></svg>
      <input id="q" type="text" placeholder="Client, mark or serial" aria-label="Search">
    </div>
    <div class="me" title="Taylor McGhee · Intake">TAM</div>
  </div>
  <div class="main">
    <div class="rail"><nav id="rail" aria-label="Sections"></nav></div>
    <div class="content"><div class="page" id="page"></div></div>
  </div>
</div>
<div id="overlay"></div>
<div class="toastw" id="toast"></div>

<script>
/* ---------- data (fictional, matches the Matters prototype's sample clients) ---------- */
const PEOPLE = {
  RB:{name:"Rebecca Beliard",role:"Owner",c:"#6A1F2B"}, DO:{name:"Dawn Otiti",role:"Senior admin",c:"#8E4A2F"},

  {id:"d1",kind:"LOE",type:"Engagement letter",title:"Engagement letter — ONEFORME PILATES",client:"Irina Vilarino",mark:"ONEFORME PILATES",status:"approval",by:"agent",who:"Post-consult agent",at:"Today, 6:12 PM",ver:1},

];
const DSTATUS = {
  draft:{label:"Draft",cls:"p-mute"}, approval:{label:"Waiting on you",cls:"p-warn"}, signed:{label:"Signed",cls:"p-ok"},

};
const PORTALS = [
  {id:"p1",client:"Irina Vilarino",mark:"ONEFORME PILATES",stage:1,last:"Viewed 2h ago",owed:"Sign engagement letter",unread:1,on:true},
  {id:"p2",client:"Vela Athletics",mark:"VELA",stage:3,last:"Viewed yesterday",owed:"",unread:0,on:true},
  {id:"p3",client:"Maison Petra",mark:"MAISON PETRA",stage:3,last:"Viewed 4 days ago",owed:"Approve OA response",unread:2,on:true},
  {id:"p4",client:"Birchwood Coffee Co.",mark:"BIRCHWOOD",stage:2,last:"Never opened",owed:"",unread:0,on:true},
  {id:"p5",client:"Dario Sette",mark:"CASA SETTE",stage:2,last:"Viewed 1 week ago",owed:"Upload specimen",unread:0,on:true},
  {id:"p6",client:"Orin & Hale",mark:"ORIN & HALE",stage:4,last:"Invite not sent",owed:"",unread:0,on:false}
];
const PSTAGES = ["Engaged","Opinion","Filed","Examination","Registered"];
const CAMPAIGNS = [
  {id:"c1",name:"PNC nurture — didn't book a strategy session",aud:"Intake · Nurture (8)",n:41,status:"live",steps:4,open:62,reply:9,next:"Tomorrow 9:00 AM · 6 emails",gate:"Every send held for approval"},

/* ---------- render + events ---------- */
function render(){
  $("#sect").textContent = S.section==="Settings"?(S.setTab==="Agents"?"Agents":"Settings"):S.section;
  renderRail();
  const pages={"Documents":docsPage,"Client portals":portalsPage,"Campaigns":campaignsPage,"Settings":settingsPage};
  $("#page").innerHTML=(pages[S.section]||docsPage)();
  renderOverlay();
}
function renderOverlay(){
  let h="";
  if(S.sel) h=docDrawer(DOCS.find(d=>d.id===S.sel));
  else if(S.portalSel) h=portalPreview(PORTALS.find(p=>p.id===S.portalSel));
  else if(S.camp) h=campDrawer(CAMPAIGNS.find(c=>c.id===S.camp));
  if(S.oauth) h+=oauthModal(S.oauth);
  if(S.confirm) h+=confirmModal(S.confirm);
  $("#overlay").innerHTML=h;
  const f=$("#overlay [role=dialog],#overlay [role=alertdialog]"); if(f){const b=f.querySelector("[role=button]");b&&b.focus({preventScroll:true})}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-docf],[data-dview],[data-doc],[data-close],[data-preview-portal],[data-camp],[data-stab],[data-agtoggle],[data-aglvl],[data-runnow],[data-connect],[data-oauth-next],[data-oauth-cancel],[data-disconnect],[data-reauth],[data-confirm-ok],[data-confirm-cancel],[data-toqueue],[data-share],[data-gen],[data-upload],[data-invite],[data-invite-one],[data-newcamp],[data-pause],[data-start],[data-inviteuser],[data-addstep],[data-dl]");
  if(!t) return; const d=t.dataset;
  if(d.docf){S.docF=d.docf;return render()}
  if(d.dview){S.docView=d.dview;return render()}
  if(d.doc){S.sel=d.doc;return renderOverlay()}
  if("close" in d){S.sel=null;S.portalSel=null;S.camp=null;return renderOverlay()}
  if(d.previewPortal){S.portalSel=d.previewPortal;return renderOverlay()}
  if(d.camp){S.camp=d.camp;return renderOverlay()}
  if(d.stab){S.setTab=d.stab;return render()}
  if(d.agtoggle){const a=AGENTS.find(x=>x.id===d.agtoggle);const on=S.agOn[a.id]!==undefined?S.agOn[a.id]:a.on;S.agOn[a.id]=!on;toast(a.name+(on?" paused":" switched on"));return render()}
  if(d.aglvl){const [id,k]=d.aglvl.split(":");const a=AGENTS.find(x=>x.id===id);const on=S.agOn[id]!==undefined?S.agOn[id]:a.on;if(!on)return;S.agLvl[id]=k;return render()}
  if(d.runnow){const a=AGENTS.find(x=>x.id===d.runnow);RUNS.unshift({agent:a.name,trig:"Run now · Taylor",st:"ok",in:"—",out:"Queued",at:"Just now",dur:"…"});toast(a.name+" queued to run");return render()}
  if(d.connect){S.oauth={provider:d.connect,scope:d.scope,step:0};return renderOverlay()}
  if(d.reauth){const m=MAILBOXES.find(x=>x.id===d.reauth);S.oauth={provider:m.provider,scope:m.scope,step:1,reauth:m.id};return renderOverlay()}
  if("oauthCancel" in d){S.oauth=null;return renderOverlay()}
  if("oauthNext" in d){const o=S.oauth;o.step++;renderOverlay();if(o.step===2){setTimeout(()=>{
      if(o.reauth){const m=MAILBOXES.find(x=>x.id===o.reauth);m.status="ok";m.synced="just now"}
      else MAILBOXES.push({id:"m"+Date.now(),scope:o.scope,provider:o.provider,email:o.scope==="firm"?(o.provider==="google"?"intake@rpblaw.com":"trademark@rpblaw.com"):"taylor@rpblaw.com",label:o.scope==="firm"?"Shared":"My mailbox",by:"You",status:"ok",synced:"just now",matched:0,since:"Today"});
      S.oauth=null;render();toast(PNAME[o.provider]+" connected · first sync running")},1400)}return}
  if(d.disconnect){const m=MAILBOXES.find(x=>x.id===d.disconnect);S.confirm={title:"Disconnect "+m.email+"?",body:"Lectual stops reading this mailbox and deletes its stored access. Timeline entries already matched to clients stay on their records.",ok:"Disconnect",id:m.id};return renderOverlay()}
  if("confirmCancel" in d){S.confirm=null;return renderOverlay()}
  if("confirmOk" in d){MAILBOXES=MAILBOXES.filter(m=>m.id!==S.confirm.id);S.confirm=null;toast("Mailbox disconnected");return render()}
  if(d.toqueue){toast("Opened in the approval queue");return}
  if(d.share){toast("Shared to the client's portal");return}
  if(d.gen){toast(d.gen+": pick a matter to draft from");return}
  if("upload" in d){toast("Drop files on a matter to upload");return}
  if("invite" in d||d.inviteOne){toast("Portal invite drafted into the queue");return}
  if("newcamp" in d){S.camp="c3";return renderOverlay()}
  if("pause" in d){toast("Campaign paused");return}
  if("start" in d){toast("Campaign started. First batch held for approval");return}
  if("inviteuser" in d){toast("Invite sent by magic link");return}
  if("addstep" in d){toast("New email step added");return}
  if("dl" in d){toast("Downloading…");return}
});
$("#q").addEventListener("input",e=>{S.q=e.target.value;render();$("#q").focus()});
window.addEventListener("hashchange",()=>{S.section=decodeURIComponent(location.hash.slice(1))||"Documents";S.sel=S.camp=S.portalSel=S.oauth=S.confirm=null;render()});
render();
</script>
</body>
</html>
