<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;width:{{ width }}px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:10px 9px;border-radius:26px;border:1px solid rgba(253,247,235,.14);background:rgba(30,8,13,.8);backdrop-filter:blur(24px) saturate(1.1);box-shadow:0 30px 70px -34px rgba(0,0,0,.75);transition:width .2s cubic-bezier(.4,0,.2,1)" onMouseEnter="{{ onEnter }}" onMouseLeave="{{ onLeave }}">

  <div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 1px;flex:0 0 auto">
    <div style="flex:1;min-width:0;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(253,247,235,.5);white-space:nowrap;overflow:hidden;opacity:{{ labelOpacity }};transition:opacity .14s">Navigate</div>
    <div style="position:relative;display:flex;align-items:center;flex:0 0 auto" onMouseEnter="{{ onPinEnter }}" onMouseLeave="{{ onPinLeave }}">
      <div style="{{ tipStyle }}">{{ pinTip }}</div>
      <div style="{{ pinStyle }}" onClick="{{ onPinClick }}" role="button" tabindex="0" aria-label="{{ pinTip }}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6M12 4v6M7 10h10l-1 5H8zM12 15v5"></path></svg>
      </div>
    </div>
  </div>

  <div style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:1px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:1px">
        <sc-if value="{{ g.spacer }}" hint-placeholder-val="{{ false }}">
          <div style="height:8px;flex:0 0 auto"></div>
        </sc-if>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;gap:1px">
            <div style="{{ it.style }}" onMouseEnter="{{ it.onEnter }}" onMouseLeave="{{ it.onLeave }}" onClick="{{ it.onClick }}" role="button" tabindex="0">
              <div style="width:24px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.d }}"></path></svg>
                <sc-if value="{{ it.dot }}" hint-placeholder-val="{{ false }}">
                  <div style="{{ it.dotStyle }}"></div>
                </sc-if>
              </div>
              <div style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:{{ labelOpacity }};transition:opacity .14s">{{ it.label }}</div>
              <div style="{{ it.countStyle }}">{{ it.count }}</div>
            </div>
            <sc-if value="{{ it.showKids }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;flex-direction:column;gap:1px;margin-left:21px;padding-left:22px;border-left:1px solid rgba(253,247,235,.14)">
                <sc-for list="{{ it.kids }}" as="k" hint-placeholder-count="2">
                  <div style="{{ k.style }}" onMouseEnter="{{ k.onEnter }}" onMouseLeave="{{ k.onLeave }}" onClick="{{ k.onClick }}" role="button" tabindex="0">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="{{ k.d }}"></path></svg>
                    <div style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ k.label }}</div>
                    <div style="{{ k.countStyle }}">{{ k.count }}</div>
                  </div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="height:1px;background:rgba(253,247,235,.12);margin:0 2px;flex:0 0 auto"></div>

  <div style="{{ settingsStyle }}" onMouseEnter="{{ onSettingsEnter }}" onMouseLeave="{{ onSettingsLeave }}" onClick="{{ onSettingsClick }}" role="button" tabindex="0">
    <div style="width:24px;display:flex;align-items:center;justify-content:center;flex:0 0 auto">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M18 6h2M4 12h2M8 12h12M4 18h12M18 18h2M16 4v4M6 10v4M16 16v4"></path></svg>
    </div>
    <div style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:{{ labelOpacity }};transition:opacity .14s">Settings</div>
  </div>

  <div style="display:flex;align-items:center;gap:12px;height:44px;padding:0 10px;flex:0 0 auto">
    <div style="width:30px;height:30px;border-radius:999px;background:#FDF7EB;color:#2A1216;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto;letter-spacing:.03em">RB</div>
    <div style="min-width:0;opacity:{{ labelOpacity }};transition:opacity .14s">
      <div style="font-size:12.5px;font-weight:500;color:#FDF7EB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Rebecca Beliard</div>
      <div style="font-size:10.5px;color:rgba(253,247,235,.55);white-space:nowrap">Profile · Sign out</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:860},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Today&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pinned&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;forceExpanded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;demoHover&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;counts&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,number|string&gt;&quot;},&quot;onNav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(label: string) =&gt; void&quot;},&quot;onPin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const I = {
  home: "M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z",
  clock: "M12 8v4l3 2M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z",
  chat: "M21 12a8 8 0 1 1-3.4-6.5L21 4l-1 4.5A7.9 7.9 0 0 1 21 12zM8 12h.01M12 12h.01M16 12h.01",
  mail: "M5 4h12a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2-3-2V6a2 2 0 0 1 2-2zM9 9h6M9 13h6",
  send: "M22 2L11 13M22 2l-7 20-4-9-9-4z",
  env: "M3 6h18v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM3 6l9 7 9-7",
  sms: "M4 5h16v10H9l-5 4z",
  cal: "M4 6h16v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 6V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v1M8 3v4M16 3v4M4 11h16",
  tray: "M3 13l3-8h12l3 8v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 13h5l1 3h6l1-3h5",
  file: "M6 3h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM15 3v5h5",
  case: "M3 8h18v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8zM8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
  users: "M16 14a4 4 0 1 0-8 0M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6M5 21c0-2.8 3.1-5 7-5s7 2.2 7 5",
  shield: "M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z",
  spark: "M12 2l1.6 4.4L18 8l-4.4 1.6L12 14l-1.6-4.4L6 8l4.4-1.6zM18 14l.9 2.5L21 17l-2.1.5L18 20l-.9-2.5L15 17l2.1-.5z",
  bolt: "M13 2L4 14h7l-1 8 9-12h-7z",
  cycle: "M3 12a9 9 0 0 1 15.5-6.3L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.3L3 16M3 21v-5h5",
  globe: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3.5 9h17M3.5 15h17M12 3c3 3.6 3 14.4 0 18M12 3c-3 3.6-3 14.4 0 18",
  bars: "M4 20V11M10 20V4M16 20v-6M21 20H3"
};

const TREE = [
  { items: [
    { label: "Home", d: I.home },
    { label: "Today", d: I.clock, count: "7" },
    { label: "Communication", d: I.chat, count: "12", kids: [
      { label: "My Mail", d: I.env, count: "5" },
      { label: "Queue", d: I.tray, count: "12" },
      { label: "Campaigns", d: I.send },
      { label: "SMS", d: I.sms }
    ] },
    { label: "Calendar", d: I.cal }
  ] },
  { spacer: true, items: [
    { label: "Intake", d: I.tray, count: "27", kids: [
      { label: "PNC", d: I.users, count: "27" },
      { label: "Forms", d: I.file }
    ] },
    { label: "Quotes & proposals", d: I.file },
    { label: "Active matters", d: I.case, count: "76", kids: [
      { label: "All matters", d: I.case, count: "76" },
      { label: "Documents", d: I.file },
      { label: "Client portals", d: I.users }
    ] }
  ] },
  { spacer: true, items: [
    { label: "IP.OS", d: I.shield, kids: [
      { label: "AI copilot", d: I.spark },
      { label: "Agents", d: I.bolt, count: "6" },
      { label: "Skills", d: I.cycle },
      { label: "Firm brain", d: I.globe }
    ] }
  ] },
  { spacer: true, items: [
    { label: "Reports", d: I.bars }
  ] }
];

const ITEM = "display:flex;align-items:center;gap:12px;height:37px;border-radius:13px;padding:0 10px;box-sizing:border-box;cursor:pointer;overflow:hidden;font-size:13px;transition:background .12s,color .12s;";
const KID = "display:flex;align-items:center;gap:9px;height:27px;border-radius:9px;padding:0 10px;box-sizing:border-box;cursor:pointer;overflow:hidden;font-size:12.5px;transition:background .12s,color .12s;";
const REST = "background:transparent;color:rgba(253,247,235,.76)";
const HOVER = "background:rgba(253,247,235,.1);color:#FDF7EB";
const ACTIVE = "background:#FDF7EB;color:#2A1216;font-weight:500;box-shadow:0 8px 20px -10px rgba(0,0,0,.55)";
const PARENT = "background:rgba(253,247,235,.07);color:#FDF7EB";
const KID_REST = "background:transparent;color:rgba(253,247,235,.66)";
const KID_ACTIVE = "background:#FDF7EB;color:#2A1216;font-weight:500";

class Component extends DCLogic {
  state = { hover: false, hk: null, pinHover: false };

  renderVals() {
    const forced = this.props.forceExpanded;
    const expanded = !!(this.props.pinned || forced || this.state.hover);
    const active = this.props.active || "Home";
    const hk = this.props.demoHover || this.state.hk;
    const counts = this.props.counts || {};
    const enter = (k) => () => this.setState({ hk: k });
    const leave = () => this.setState({ hk: null });
    const nav = this.props.onNav;
    const go = (k) => nav ? (() => nav(k)) : null;

    const MONO = "font-family:'Courier Prime','Courier New',monospace;";
    const countStyle = (on, show) => MONO + "font-size:10.5px;flex:0 0 auto;white-space:nowrap;transition:opacity .14s;opacity:" + (show ? 1 : 0) + ";color:" + (on ? "#8E2733" : "rgba(253,247,235,.6)") + ";";
    const kidCount = (on) => MONO + "font-size:10px;flex:0 0 auto;color:" + (on ? "#8E2733" : "rgba(253,247,235,.66)") + ";opacity:" + (on ? 1 : .7) + ";";

    const groups = TREE.map((g) => ({
      spacer: !!g.spacer,
      items: g.items.map((it) => {
        const kids = it.kids || [];
        const isActive = active === it.label;
        const parentActive = kids.some((k) => k.label === active);
        const count = counts[it.label] !== undefined ? String(counts[it.label]) : (it.count || "");
        return {
          label: it.label, d: it.d,
          style: ITEM + (isActive ? ACTIVE : parentActive ? PARENT : hk === it.label ? HOVER : REST),
          count: count,
          countStyle: countStyle(isActive, expanded && !!count),
          dot: !expanded && !!count && !isActive,
          dotStyle: "position:absolute;top:-1px;right:0px;width:5px;height:5px;border-radius:999px;background:#EFD9DC",
          showKids: expanded && kids.length > 0,
          onEnter: enter(it.label), onLeave: leave, onClick: go(it.label),
          kids: kids.map((k) => {
            const on = active === k.label;
            const kc = counts[k.label] !== undefined ? String(counts[k.label]) : (k.count || "");
            return {
              label: k.label, d: k.d, count: kc, countStyle: kidCount(on),
              style: KID + (on ? KID_ACTIVE : hk === k.label ? HOVER : KID_REST),
              onEnter: enter(k.label), onLeave: leave, onClick: go(k.label)
            };
          })
        };
      })
    }));

    const settingsOn = active === "Settings";
    return {
      groups,
      width: expanded ? 262 : 62,
      labelOpacity: expanded ? 1 : 0,
      settingsStyle: ITEM + "flex:0 0 auto;" + (settingsOn ? ACTIVE : hk === "Settings" ? HOVER : REST),
      onSettingsEnter: enter("Settings"), onSettingsLeave: leave, onSettingsClick: go("Settings"),
      pinTip: this.props.pinned ? "Unpin navigation" : "Pin navigation",
      pinStyle: "width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;transition:background .12s,color .12s,border-color .12s;box-sizing:border-box;border:1px solid " + (this.props.pinned ? "rgba(253,247,235,.55)" : "rgba(253,247,235,.24)") + ";color:" + (this.props.pinned ? "#FDF7EB" : "rgba(253,247,235,.6)") + ";background:" + (this.props.pinned ? "rgba(253,247,235,.14)" : "transparent") + ";opacity:" + (expanded ? 1 : 0) + ";pointer-events:" + (expanded ? "auto" : "none"),
      onPinClick: this.props.onPin || null,
      onPinEnter: () => this.setState({ pinHover: true }),
      onPinLeave: () => this.setState({ pinHover: false }),
      tipStyle: "position:absolute;right:31px;top:50%;transform:translateY(-50%);white-space:nowrap;padding:4px 9px;border-radius:7px;background:#FDF7EB;color:#2A1216;font-size:11.5px;box-shadow:0 1px 2px rgba(20,4,8,.16),0 10px 22px -16px rgba(20,4,8,.7);pointer-events:none;transition:opacity .12s;opacity:" + (this.state.pinHover && expanded ? "1" : "0"),
      onEnter: forced ? null : () => this.setState({ hover: true }),
      onLeave: forced ? null : () => this.setState({ hover: false, hk: null })
    };
  }
}
</script>
</body>
</html>
